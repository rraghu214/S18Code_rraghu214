<svg width="680" height="600" viewBox="0 0 680 600" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Three-harness evaluation architecture for Session 18</title>
<desc>Three coding harnesses all call one fixed hosted model, Qwen3.5-9B via OpenRouter — our harness via GLC v5's existing OpenRouter provider, Qwen Code and DeepSeek Harness directly. Every run is saved as raw JSON before scoring. A shared scorer produces four fields, feeding a report.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="600" fill="#FFFFFF"/>

<line x1="130" y1="96" x2="340" y2="156" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="340" y1="96" x2="340" y2="156" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="550" y1="96" x2="340" y2="156" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="340" y1="212" x2="340" y2="272" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="340" y1="328" x2="340" y2="388" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="340" y1="444" x2="340" y2="504" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<text x="130" y="114" text-anchor="middle" font-size="12" fill="#5F5E5A" font-family="sans-serif">via GLC v5</text>
<text x="358" y="114" text-anchor="start" font-size="12" fill="#5F5E5A" font-family="sans-serif">direct</text>
<text x="550" y="114" text-anchor="middle" font-size="12" fill="#5F5E5A" font-family="sans-serif">direct</text>

<g>
<rect x="40" y="40" width="180" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="130" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C" font-family="sans-serif">Our harness</text>
<text x="130" y="76" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5" font-family="sans-serif">S18Code loop.py</text>
</g>

<g>
<rect x="250" y="40" width="180" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C" font-family="sans-serif">Qwen Code</text>
<text x="340" y="76" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5" font-family="sans-serif">qwen -p headless</text>
</g>

<g>
<rect x="460" y="40" width="180" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="550" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C" font-family="sans-serif">DeepSeek Harness</text>
<text x="550" y="76" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5" font-family="sans-serif">WSL2 required</text>
</g>

<g>
<rect x="230" y="156" width="220" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="340" y="174" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806" font-family="sans-serif">Gemini (Flash) via GLC v5</text>
<text x="340" y="192" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B" font-family="sans-serif">free tier, one model, held fixed</text>
</g>

<g>
<rect x="230" y="272" width="220" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="290" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041" font-family="sans-serif">Raw JSON per run</text>
<text x="340" y="308" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56" font-family="sans-serif">before scoring, 27 files</text>
</g>

<g>
<rect x="230" y="388" width="220" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="406" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041" font-family="sans-serif">Scorer</text>
<text x="340" y="424" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56" font-family="sans-serif">4 axes, not one score</text>
</g>

<text x="460" y="420" text-anchor="start" font-size="12" fill="#5F5E5A" font-family="sans-serif">&#8635; rescore.py replays saved JSON</text>

<g>
<rect x="230" y="504" width="220" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="522" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041" font-family="sans-serif">Report</text>
<text x="340" y="538" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56" font-family="sans-serif">one narrow claim</text>
</g>
</svg>
